[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kilat"
version = "2.0.0"
description = "Kilat: kernelized lightweight attention."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdul Wahid Rukua", email = "rukuaabdulwahid@gmail.com" },
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "triton>=2.0",
    "sentencepiece>=0.2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
reporting = [
    "wandb>=0.16",
    "tensorboard>=2.14",
    "mlflow>=2.10",
    "comet_ml>=3.45",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pre-commit>=3.5.0",
    "types-PyYAML>=6.0",
    "types-tqdm>=4.66",
]

[project.scripts]
kilat = "kilat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kilat*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
]
ignore = [
    "E501",  # line length (handled by formatter or relaxed for ML/math docstrings)
    "E401",  # multiple imports on one line
    "E741",  # ambiguous variable name
    "F401",  # unused imports (preserved for re-exports and module stubs)
    "F841",  # unused variables
    "F811",  # redefinition of unused import
    "F541",  # f-string without placeholders
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"src/kilat/inference/export_hf.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["kilat"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["kilat"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
show_error_codes = true
disable_error_code = [
    "var-annotated",
    "attr-defined",
    "assignment",
    "operator",
    "arg-type",
    "index",
    "union-attr",
    "return-value",
    "misc",
    "list-item",
]
exclude = [
    "^build/",
    "^dist/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "triton.*",
    "transformers.*",
    "pyarrow.*",
    "safetensors.*",
    "wandb.*",
    "mlflow.*",
    "comet_ml.*",
    "tensorboard.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-s -q"
filterwarnings = [
    "ignore::UserWarning:torch.utils.data.dataloader",
    "ignore:.*pin_memory.*:UserWarning",
    "ignore:.*Tokenizer vocabulary could not be resolved.*:UserWarning",
    "ignore:.*KilatDataset is deprecated.*:DeprecationWarning",
]
