# ==============================================================================
# Kilat Tier-3 Config: Standard Large DeepSeekMoE Architecture (`standard_moe.yaml`)
# ==============================================================================
# Purpose : Research-scale 54.2B parameter DeepSeekMoE architecture with 64 routed
#           experts (Top-8 active), 2 shared experts, Hybrid Global Decay + Latent MLA.
# Note    : At 54.2B parameters (~108 GB BF16 weights, ~432 GB FP32 AdamW states),
#           this preset is a target for future FSDP / Expert Parallelism (EP).
# Hardware: Multi-Node cluster with FSDP / EP (e.g. 16x–64x A100 / H100 80GB).
# Usage   :
#   kilat verify --config configs/standard_moe.yaml
# ==============================================================================

experiment:
  name: kilat-standard-moe
  description: Large-scale 54.2B DeepSeekMoE with Hybrid Global Decay + Latent MLA (FSDP target)
  tags: ["tier-3", "moe", "fsdp-target", "deepseek-moe", "mla", "rope", "wsdlr"]

model:
  vocab_size: 50257
  n_embd: 2048
  n_layer: 24
  n_head: 32
  max_position_embeddings: 4096

  recall_ratio: 0.5
  latent_dim: 512
  attn_drop: 0.0

  use_rope: true
  rope_head_dim: 32
  rope_base: 10000.0

  ffn_mode: moe
  ff_mult: 2.6666666667
  ffn_dropout: 0.0
  num_experts: 64
  active_experts: 8
  num_shared_experts: 2
  fine_grained_factor: 1
  aux_loss_coef: 0.01
  device_balance_coef: 0.001
  router_balance_mode: bias_free
  bias_update_speed: 0.001

  embd_drop: 0.0
  resid_drop: 0.0
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  tie_word_embeddings: true
  use_cache: false
  initializer_range: 0.02
  debug_nan_checks: false

tokenizer:
  tokenizer_type: gpt2
  tokenizer_name_or_path: gpt2
  use_fast: true
  local_files_only: true

dataloader:
  dataset_format: memmap
  train_data_path: ./data/train.npy
  eval_data_path: ./data/val.npy
  train_batch_size: 4
  eval_batch_size: 4
  max_seq_length: 2048
  truncation: right
  use_packing: true
  packed_block_size: 2048
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  drop_last: true
  use_distributed_sampler: true
  distributed_shuffle: true
  cache_dir: null
  prefetch_batches: 2

training:
  output_dir: ./checkpoints/standard_moe
  resume_from_checkpoint: null
  save_checkpoints: true
  atomic_checkpoint: true
  training_mode: steps
  max_steps: 100000
  num_train_epochs: 1
  warmup_steps: 2000
  learning_rate: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  weight_decay: 0.1
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  scheduler_type: wsdlr
  scheduler_kwargs:
    num_decay_steps: 10000
  precision: bf16
  logging_steps: 50
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 5
  early_stopping_patience: 5
  early_stopping_threshold: 0.0
  metric_for_best_model: eval_loss
  greater_is_better: null
  report_to: "wandb"
  run_name: kilat-standard-moe
  seed: 42
