default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(src|experiments|docs|sample_config|README\.md)
      - id: end-of-file-fixer
        exclude: ^(src|experiments|docs|sample_config|README\.md)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--config, pyproject.toml]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'if [ -x .venv/bin/mypy ]; then .venv/bin/mypy src; else mypy src; fi'
        language: system
        types: [python]
        pass_filenames: false
