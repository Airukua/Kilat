name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN (NCSC secure development; OpenSSF Scorecard "Token-Permissions").
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to immutable commit SHAs (tag shown in trailing comment);
# Dependabot (.github/dependabot.yml) proposes SHA bumps.

jobs:
  lint-and-typecheck:
    name: Lint, SAST & Type Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter + Bandit-equivalent SAST (rule set S)
        run: |
          ruff check src tests

      - name: Run Mypy type checker
        run: |
          mypy src

      - name: Run Pre-commit validation
        run: |
          pre-commit run --all-files

  test-and-assurance:
    name: BDD Tests, Gate 0 Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch and Kilat
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" pip-audit

      - name: Run test suite
        run: |
          make test PYTHON=python

      - name: Run Gate 0 security & supply-chain scan
        run: |
          make security PYTHON=python

      - name: Audit installed dependencies for known CVEs (OWASP LLM03 / A06)
        run: |
          pip-audit --progress-spinner off

  package-build:
    name: Package Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package distribution
        run: |
          python -m build

      - name: Validate distribution artifacts
        run: |
          twine check dist/*
