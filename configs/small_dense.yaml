# ==============================================================================
# Kilat Tier-1 Config: Small Dense Hybrid Transformer (`small_dense.yaml`)
# ==============================================================================
# Purpose : Single-GPU (~125M class) pre-training with SwiGLU + Hybrid MLA/Decay.
# Hardware: 1x GPU with 8GB–16GB VRAM (Ampere+ recommended for BF16).
# Usage   :
#   kilat prepare-data --input corpus.jsonl --output ./data/train.npy --tokenizer gpt2 --dtype int32
#   kilat verify --config configs/small_dense.yaml
#   kilat train  --config configs/small_dense.yaml
# ==============================================================================

experiment:
  name: kilat-small-dense
  description: Single-GPU dense SwiGLU + Hybrid Global Decay/MLA + Decoupled RoPE pre-training
  tags: ["tier-1", "dense", "swiglu", "mla", "rope", "wsdlr"]

model:
  vocab_size: 50257
  n_embd: 768
  n_layer: 12
  n_head: 12
  max_position_embeddings: 2048

  # 50% O(N) Global Exponential Decay heads + 50% Low-Rank Latent MLA heads
  recall_ratio: 0.5
  latent_dim: 128
  attn_drop: 0.0

  # Decoupled RoPE on MLA recall queries & keys
  use_rope: true
  rope_head_dim: 32
  rope_base: 10000.0

  # Dense SwiGLU Feed-Forward (uses Gated SwiGLU; "dense" and "swiglu" are supported interchangeably)
  ffn_mode: swiglu
  ff_mult: 2.6666666667
  ffn_dropout: 0.0

  embd_drop: 0.0
  resid_drop: 0.0
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  tie_word_embeddings: true
  use_cache: false
  initializer_range: 0.02
  debug_nan_checks: false

tokenizer:
  tokenizer_type: gpt2
  tokenizer_name_or_path: gpt2
  use_fast: true
  local_files_only: true

dataloader:
  dataset_format: memmap
  train_data_path: ./data/train.npy
  eval_data_path: ./data/val.npy
  train_batch_size: 8
  eval_batch_size: 8
  max_seq_length: 1024
  truncation: right
  use_packing: false
  packed_block_size: null
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  drop_last: true
  use_distributed_sampler: true
  distributed_shuffle: true
  cache_dir: null
  prefetch_batches: 2

training:
  output_dir: ./checkpoints/small_dense
  resume_from_checkpoint: null
  save_checkpoints: true
  atomic_checkpoint: true
  training_mode: steps
  max_steps: 50000
  num_train_epochs: 1
  warmup_steps: 1000
  learning_rate: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  weight_decay: 0.1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  # Warmup-Stable-Decay (WSDLR) schedule for continual & multi-stage scaling
  scheduler_type: wsdlr
  scheduler_kwargs:
    num_decay_steps: 5000
  precision: bf16
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  early_stopping_patience: 5
  early_stopping_threshold: 0.0
  metric_for_best_model: eval_loss
  greater_is_better: null
  report_to: "none"
  run_name: kilat-small-dense
  seed: 42
