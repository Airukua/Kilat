# ==============================================================================
# Kilat TinyStories 35M Research Model (GPU Native)
# Targets: Microsoft Research TinyStories Benchmark (~33M class, Eldan & Li 2023)
# Hardware: NVIDIA GeForce RTX 4050 (6GB VRAM) / Ampere / Ada Lovelace
# ==============================================================================

experiment:
  name: kilat-tinystories-35m-hybrid
  description: 35M Parameter TinyStories pre-training with Sub-Quadratic Hybrid Decay + Latent MLA
  tags: ["tinystories", "research-benchmark", "hybrid-mla", "decay", "bf16", "gpu"]

model:
  vocab_size: 50257
  max_position_embeddings: 512
  n_embd: 384
  n_layer: 8
  n_head: 6
  recall_ratio: 0.5
  latent_dim: 96
  use_rope: true
  rope_head_dim: 32
  rope_base: 10000.0
  ffn_mode: swiglu
  ff_mult: 2.6666666667
  tie_word_embeddings: true
  embd_drop: 0.0
  resid_drop: 0.0
  attn_drop: 0.0
  pad_token_id: 50256
  bos_token_id: 50256
  eos_token_id: 50256

tokenizer:
  tokenizer_type: gpt2
  tokenizer_name_or_path: gpt2

dataloader:
  dataset_format: memmap
  train_data_path: experiments/train.npy
  eval_data_path: experiments/eval.npy
  allow_train_val_overlap: true
  train_batch_size: 16
  eval_batch_size: 16
  max_seq_length: 512
  num_workers: 2
  pin_memory: true
  persistent_workers: false

training:
  output_dir: ./checkpoints/tinystories_gpu
  training_mode: steps
  max_steps: 1000
  learning_rate: 0.0006
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_accumulation_steps: 4
  precision: bf16
  torch_compile: true
  seed: 42
  scheduler_type: cosine
  warmup_steps: 100
  save_steps: 250
  save_total_limit: 2
  save_checkpoints: true
  atomic_checkpoint: true
  eval_steps: 500
  logging_steps: 10
  report_to: none
