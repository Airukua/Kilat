# ==============================================================================
# Kilat TinyStories Pre-Training Verification Config (`tinystories.yaml`)
# ==============================================================================
# Purpose : Empirical proof-of-learning on real English TinyStories corpus.
#           Demonstrates loss convergence, perplexity reduction, and autoregressive
#           generation with Hybrid Sub-Quadratic Attention + Decoupled RoPE.
# ==============================================================================

experiment:
  name: kilat-tinystories-proof
  description: Real TinyStories pre-training validation with Hybrid Decay/MLA + RoPE + SwiGLU
  tags: ["tinystories", "empirical-proof", "hybrid-mla", "decay", "rope", "swiglu"]

model:
  vocab_size: 50257
  n_embd: 256
  n_layer: 4
  n_head: 8
  max_position_embeddings: 512

  # Hybrid Attention: 50% Global Decay + 50% Latent MLA
  recall_ratio: 0.5
  latent_dim: 64
  attn_drop: 0.0

  # Decoupled RoPE
  use_rope: true
  rope_head_dim: 16
  rope_base: 10000.0

  # Dense Gated SwiGLU FFN
  ffn_mode: swiglu
  ff_mult: 2.6666666667
  ffn_dropout: 0.0

  embd_drop: 0.0
  resid_drop: 0.0
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  tie_word_embeddings: true
  use_cache: true
  initializer_range: 0.02

tokenizer:
  tokenizer_type: gpt2
  tokenizer_name_or_path: gpt2

dataloader:
  dataset_format: memmap
  train_data_path: data/tinystories/train.npy
  eval_data_path: data/tinystories/eval.npy
  allow_train_val_overlap: true
  train_batch_size: 8
  eval_batch_size: 8
  max_seq_length: 256
  num_workers: 0
  pin_memory: false
  persistent_workers: false

training:
  output_dir: ./checkpoints/tinystories
  training_mode: steps
  max_steps: 50
  learning_rate: 0.0008
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  precision: fp32
  seed: 42
  scheduler_type: cosine
  warmup_steps: 5
  save_steps: 25
  save_total_limit: 2
  save_checkpoints: true
  atomic_checkpoint: true
  eval_steps: 25
  logging_steps: 5
  report_to: none
